<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings -- Mining Bots</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link href="styles.css" rel="stylesheet" />
  <script src="cookies.js"></script>
  <script src="settings.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">Settings</a>
    <div id="action-container">
      <button onclick="ok_clicked();" title="This can also be triggered by pressing Alt-Shift-S" accesskey="s" id="ok-button">OK</button>
      <button onclick="cancel_clicked();" title="This can also be trigger by pressing Escape or closing the window" id="cancel-button">Cancel</button> 
      <button onclick="apply_clicked();" title="This can also be triggered by pressing Alt-Shift-A" accesskey="a" id="apply-button">Apply</button>
    </div>
  </nav>


  <div id="settings-megacontainer">
    <div id="secure-protocols-settings" class="setting-container">
        <div id="secure-protocols-setting-text" class="setting-text-container">
            <h6 class="setting-text-name">Use secure protocols</h6>
            <p class="setting-text-description">Use HTTPS and WSS over HTTP and WS</p>
        </div>
        <input type="checkbox" id="secure-protocols-setting-value" class="setting-value">
    </div>
    <div id="localhost-port-settings" class="setting-container">
      <div id="localhost-port-setting-text" class="setting-text-container">
          <h6 class="setting-text-name">Port number</h6>
          <p class="setting-text-description">Port number used when connecting to the &quot;Testing&quot; server</p>
      </div>
      <input type="number" id="localhost-port-setting-value" class="setting-value" style="height:20px;" min="1" max="65535">
  </div>
  <script>initialize_popup();</script>
</body>

</html>
