<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings -- Mining Bots</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link href="/styles/site.css" rel="stylesheet" />
  <script src="/scripts/cookies.js"></script>
  <script src="/scripts/utilities/keyboard_utilities.js"></script>
  <script src="/scripts/utilities/svgimporter.js"></script>
  <script src="/scripts/ui/help.js"></script>
  <script src="/scripts/ui/notifications.js"></script>
  <script src="/scripts/utilities/functools.js"></script>
  <script src="/scripts/utilities/json_download.js"></script>
  <script src="/scripts/settings.js"></script>
  <script src="/scripts/ui/dark_mode.js"></script>
  <style>
    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>

<body>
  <div id="main">
    <nav id="navbar" class="navbar navbar-expand-lg navbar-light bg-light settings-top-bar">
      <a class="navbar-brand" href="#">Settings</a>
      <div id="action-container">
        <a onclick="show_settings_help()" title="Help" role="button" id="help">
          <svgfile aria-hidden="true" src="/images/ui/help.svg" id="help-icon" alt="help icon"></svgfile>
        </a>
        <a role="button"  onclick="ok_clicked();" title="OK"
          id="ok-button"><svgfile saria-hidden="true" src="/images/ui/ok.svg"></svgfile></a>
        <a role="button" onclick="cancel_clicked();" title="Cancel"
          id="cancel-button"><svgfile aria-hidden="true" src="/images/ui/cancel.svg" style="width:20px;"></svgfile></a>
        <a role="button" onclick="apply_clicked();" title="Apply"
          id="apply-button"><svgfile aria-hidden="true" src="/images/ui/apply.svg"></svgfile></a>
        <a role="button" onclick="export_settings();" title="Export settings"
          id="export-button"><svgfile aria-hidden="true" src="/images/ui/export.svg"></svgfile></a>
        <a role="button" onclick="import_settings();" title="Import settings"
          id="import-button"><svgfile aria-hidden="true" src="/images/ui/import.svg"></svgfile></a>
        <script>
          document.addEventListener("DOMContentLoaded",()=> {
            function setMnemonic(element, key,additional_key) {
              let keyTag = KeyboardUtilities.joinMnemonic(key) + (additional_key ? ` or ${additional_key}` : '')
              element.title += ` (${keyTag})`;
              let describerId=`${element.id}-description`;
              element.setAttribute("aria-labelledby", `${element.id}-label`);
              document.getElementById(describerId).textContent = `Shortcut: (${keyTag})`;
              element.setAttribute("aria-describedby", describerId);
            }
            setMnemonic(document.getElementById("ok-button"),'O');
            setMnemonic(document.getElementById("cancel-button"),'C','Escape');
            setMnemonic(document.getElementById("apply-button"),'A');
            setMnemonic(document.getElementById("export-button"),'S');
            setMnemonic(document.getElementById("import-button"),'I');
          });
        </script>
      </div>
    </nav>


    <div id="settings-megacontainer">
      <!-- Items will be auto-populated by settings.js -->
      <div id="reset_button_container">
        <button onclick="reset_settings_clicked();" id="reset_button">Reset all to default</button>
      </div>
    </div>
  </div>
  <div id="saving-cover-board" style="display:none">
    <div id="saving-cover-board-content">
      <b style="color:white;font-size: 32px;user-select: none;">
        Saving...
      </b>
    </div>
  </div>
  <script>initialize_popup();</script>
  <div id="accessibility-labels" style="display:none">
    <span id="help-label">Help</span>
    <span id="help-description"></span>
    <span id="ok-button-label">OK</span>
    <span id="ok-button-description"></span>
    <span id="cancel-button-label">Cancel</span>
    <span id="cancel-button-description"></span>
    <span id="apply-button-label">Apply</span>
    <span id="apply-button-description"></span>
    <span id="export-button-label">Export</span>
    <span id="export-button-description"></span>
    <span id="import-button-label">Import</span>
    <span id="import-button-description"></span>
</body>

</html>
