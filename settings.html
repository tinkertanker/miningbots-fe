<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings -- Mining Bots</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link href="/styles/site.css" rel="stylesheet" />
  <script src="/scripts/cookies.js"></script>
  <script src="/scripts/utilities/keyboard_utilities.js"></script>
  <script src="/scripts/utilities/svgimporter.js"></script>
  <script src="/scripts/ui/help.js"></script>
  <script src="/scripts/ui/notifications.js"></script>
  <script src="/scripts/utilities/functools.js"></script>
  <script src="/scripts/utilities/json_download.js"></script>
  <script src="/scripts/settings.js"></script>
  <script src="/scripts/ui/dark_mode.js"></script>
  <style>
    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>

<body>
  <div id="main">
    <nav id="navbar" class="navbar navbar-expand-lg navbar-light bg-light settings-top-bar">
      <a class="navbar-brand" href="#">Settings</a>
      <div id="action-container">
        <a href="#" onclick="show_settings_help()" title="Help" role="button" id="help">
          <svgfile src="/images/ui/help.svg" id="help-icon" alt="help icon"></svgfile>
        </a>
        <a role="button" href="#" onclick="ok_clicked();" title="OK"
          id="ok-button"><svgfile src="/images/ui/ok.svg"></svgfile></a>
        <a role="button" href="#" onclick="cancel_clicked();" title="Cancel"
          id="cancel-button"><svgfile src="/images/ui/cancel.svg" style="width:20px;"></svgfile></a>
        <a role="button" href="#" onclick="apply_clicked();" title="Apply"
          id="apply-button"><svgfile src="/images/ui/apply.svg"></svgfile></a>
        <a role="button" href="#" onclick="export_settings();" title="Export settings"
          id="export-button"><svgfile src="/images/ui/export.svg"></svgfile></a>
        <a role="button" href="#" onclick="import_settings();" title="Import settings"
          id="import-button"><svgfile src="/images/ui/import.svg"></svgfile></a>
        <script>
          document.getElementById("ok-button").title += ` (${KeyboardUtilities.joinMnemonic('O')})`;
          document.getElementById("cancel-button").title += ` (${KeyboardUtilities.joinMnemonic('C')} or Esc)`;
          document.getElementById("apply-button").title += ` (${KeyboardUtilities.joinMnemonic('A')})`;
          document.getElementById("export-button").title += ` (${KeyboardUtilities.joinMnemonic('S')})`;
          document.getElementById("import-button").title += ` (${KeyboardUtilities.joinMnemonic('I')})`;
        </script>
      </div>
    </nav>


    <div id="settings-megacontainer">
      <!-- Items will be auto-populated by settings.js -->
      <div id="reset_button_container">
        <button onclick="reset_settings_clicked();" id="reset_button">Reset all to default</button>
      </div>
    </div>
  </div>
  <div id="saving-cover-board" style="display:none">
    <div id="saving-cover-board-content">
      <b style="color:white;font-size: 32px;user-select: none;">
        Saving...
      </b>
    </div>
  </div>
  <script>initialize_popup();</script>
</body>

</html>
