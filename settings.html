<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings -- Mining Bots</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link href="/styles/site.css" rel="stylesheet" />
  <script src="/scripts/cookies.js"></script>
  <script src="/scripts/utilities/detect_mac.js"></script>
  <script src="/scripts/ui/notifications.js"></script>
  <script src="/scripts/ui/mnemonics.js"></script>
  <script src="/scripts/utilities/functools.js"></script>
  <script src="/scripts/settings.js"></script>
  <script src="/scripts/ui/dark_mode.js"></script>
  <style>
    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
</head>

<body>
  <div id="main">
    <nav id="navbar" class="navbar navbar-expand-lg navbar-light bg-light settings-top-bar">
      <a class="navbar-brand" href="#">Settings</a>
      <div id="action-container">
        <button onclick="ok_clicked();"
          id="ok-button"><span class="mnemonic">O</span>K</button>
        <button onclick="cancel_clicked();"
          id="cancel-button"><span class="mnemonic">C</span>ancel</button>
        <button onclick="apply_clicked();"
          id="apply-button"><span class="mnemonic">A</span>pply</button>
      </div>
    </nav>


    <div id="settings-megacontainer">
      <!-- Items will be auto-populated by settings.js -->
      <div id="reset_button_container">
        <button onclick="reset_settings_clicked();" id="reset_button">Reset all to default</button>
      </div>
    </div>
  </div>
  <div id="saving-cover-board" style="display:none">
    <div id="saving-cover-board-content">
      <b style="color:white;font-size: 32px;user-select: none;">
        Saving...
      </b>
    </div>
  </div>
  <script>initialize_popup();</script>
</body>

</html>
