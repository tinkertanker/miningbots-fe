<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mining Bots</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link href="/styles/site.css" rel="stylesheet" />

  <script src="/scripts/utilities/functools.js"></script>
  <script src="/scripts/settings.js"></script>
  <script src="/scripts/browsersettings.js"></script>
  <script src="/scripts/socketnames.js"></script>
  <script src="/scripts/cookies.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.4/purify.min.js"
    integrity="sha384-KGmzmwrs7oAU2sG5qfETslFsscVcCaxQrX2d7PW7I9bTrsuTD/eSMFr9jaMS9i+b"
    crossorigin="anonymous"></script>
  <script src="/scripts/utilities/keyboard_utilities.js"></script>
  <script src="/scripts/utilities/svgimporter.js"></script>
  <script src="/scripts/ui/webdialog.js"></script>
  <script src="/scripts/ui/dark_mode.js"></script>
  <script src="/scripts/ui/help.js"></script>
  <script src="/scripts/ui/human_readable_names.js"></script>
  <script src="/scripts/ui/notifications.js"></script>
  <script src="/scripts/ui/hide_navbar.js"></script>
  <script src="/scripts/ui/loadingbox.js"></script>
  <script src="/scripts/ui/toggle_navigation.js"></script>
  <script src="/scripts/ui/server_text.js"></script>
  
  <script src="/scripts/game.js"></script>
</head>

<body onbeforeunload="if(navigator.onLine && should_confirm_unload())return true;">
  <div id="main" class="usedark">
    <nav id="navbar" class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="#">
        <img src="favicon.ico" class="navbar-brand-logo" alt="tinkertanker logo">
        Mining Bots
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown"
        aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation" onclick="toggleNavigation();">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle collapse-if-minified" href="#" id="navbarDropdownMenuLink" role="button"
              data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              Select a server
            </a>
            <div id="dropdown-menu" class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
              <!-- Dropdown items will be dynamically populated -->
            </div>
          </li>
        </ul>
      </div>
      <span role="presentation" id="gameStatus"></span>
      <span role="presentation" id="gameID"></span>
      <a onclick="show_help()" title="Help" role="button" id="help">
        <svgfile aria-hidden="true" src="/images/ui/help.svg" id="help-icon" alt="help icon"></svgfile>
      </a>
      <a role="button" title="Settings" onclick="settings_window=open_popup();" id="settings-button"><svgfile aria-hidden="true" id="settings-icon" src="/images/ui/settings.svg"></svgfile></a>
      <script>document.getElementById('settings-button').title+= ` (${KeyboardUtilities.joinMnemonic('E')})`</script>
    </nav>

    <!--Allows the game canvas and a collection of players' bots to be aligned side-by-side horizontally-->
    <div id="game-info-container">
      <!--The drawing of the game-->
      <canvas id="gameCanvas" aria-label="game map view"></canvas>

      <!--A DIV to hold all the player-bot info-->
      <div class="sidebar-container sidebar-hidden" id="bot-info-megacontainer">
        <!--For the purpose of allowing >2 players to be shown, probably best to also dynamically populate this-->
        <!-- <div class="sidebar" id="bot-sidebar-one"></div>
        <div class="sidebar" id="bot-sidebar-two"></div>
        <div class="sidebar" id="bot-sidebar-three"></div> -->
      </div>
    </div>

    <div class="loadingbox" id="loadingbox">
      <noscript id="page-cover">
        <p id="page-cover-content">
          JavaScript must be enabled to open this page.<br>
          Once enabled, refresh the page.
        <p>
      </noscript>
    </div>
  </div>
</body>

</html>
